<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; margin: 0; padding: 16px; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; color: #1a1a1a; }
    h1 { font-size: 16px; margin: 0 0 12px; color: #007782; }
    label { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; cursor: pointer; }
    p { margin: 12px 0 0; font-size: 12px; color: #666; }
    footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 10px; border-top: 1px solid #e5e5e5; font-size: 12px; color: #888; }
    footer a { color: #007782; font-weight: 600; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>🔁 ReVint</h1>
  <label><input type="checkbox" id="deleteOld"> Borrar el anuncio original tras republicar</label>
  <label><input type="checkbox" id="confirm"> Pedir confirmación antes de republicar</label>
  <p>Abre uno de tus artículos en Vinted y pulsa el botón «Republicar» de abajo a la derecha.</p>
  <footer>
    <span id="version"></span>
    <a href="https://github.com/16maniatic/ReVint/releases" target="_blank" rel="noopener">Comprobar actualizaciones</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
